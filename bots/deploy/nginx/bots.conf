# bots vhost for ks-b — installed as /etc/nginx/conf.d/bots.conf (PFA-127)
#
#   front   127.0.0.1:3014   (pm2: bots-front)      — the only part routed here
#   api     127.0.0.1:7200   (pm2: bots-nest-api)   — loopback only, called by the front's server
#   runner  127.0.0.1:7300   (pm2: bots-runner)     — loopback only, called by the API
#
# Unlike folio's, there is no `/api/` location on purpose: the browser never talks to the API, the
# Next server does, on ks-b. A request for `/api/…` lands on the front, which has no such route.
#
# Port 80 (ACME challenge + http->https redirect) is handled by the shared
# 00-http-redirect.conf default_server — no vhost-specific block needed here.
#
# Install:
#   scp bots/deploy/nginx/bots.conf debian@ks-b:/tmp/bots.conf
#   ssh debian@ks-b 'sudo cp /tmp/bots.conf /etc/nginx/conf.d/bots.conf && sudo nginx -t && sudo nginx -s reload'

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    http2 on;

    server_name bots.1991computer.com;

    # Its own certificate, like folio's, spira's and zeus's: a separate cert keeps
    # this app's renewal lifecycle out of every other app's blast radius.
    #   sudo certbot certonly --webroot -w /var/www/letsencrypt -d bots.1991computer.com
    ssl_certificate     /etc/letsencrypt/live/bots.1991computer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bots.1991computer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bots.access.log combined;

    add_header Alt-Svc 'h3=":443"';
    add_header X-Content-Type-Options nosniff;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deploy changelogs, written by deploy-front.sh / deploy-api.sh / deploy-runner.sh.
    location = /deploys-front.txt {
        alias /var/www/bots/deploy-logs/deploys-front.txt;
        default_type text/plain;
        charset utf-8;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /deploys-api.txt {
        alias /var/www/bots/deploy-logs/deploys-api.txt;
        default_type text/plain;
        charset utf-8;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /deploys-runner.txt {
        alias /var/www/bots/deploy-logs/deploys-runner.txt;
        default_type text/plain;
        charset utf-8;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
