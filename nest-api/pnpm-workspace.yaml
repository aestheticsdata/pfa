allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/engines': true
  cpu-features: true
  prisma: true
  sharp: true
  ssh2: true
  tesseract.js: false
  unrs-resolver: true
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - cpu-features
  - prisma
  - sharp
  - ssh2
  - unrs-resolver
# House rule: TypeScript stays on the latest 5.x. @nestjs/cli 12 asks for ~6.0 (PFA-265); it builds
# fine on 5.9.3, so the whole tree is held there.
overrides:
  typescript: 5.9.3
