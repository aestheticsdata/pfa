<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Saisie rapide d’une dépense</title>

<style>

body{margin:0}
a{color:#0A66C2}a:hover{color:#084F96}
.board{display:flex;gap:56px;padding:40px;box-sizing:border-box;background:#E6E8EC;font-family:'Geist',system-ui,sans-serif}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-size:13px;font-weight:500;color:#3F4855;height:16px;line-height:16px}

.dark{--bg:#000B18;--sf:#15171A;--sf2:#212428;--sf3:#2A2D31;--ln:#2E3236;--ln2:#1F2225;--ink:#F5F7F9;--ink2:#B5B8BA;--ink3:#878A8E;--acc:#00B4F0;--accbg:rgba(0,180,240,.14);--pos:#87E496;--posbg:rgba(135,228,150,.10);--posln:rgba(135,228,150,.45);--neg:#FD736D;--negbg:rgba(253,115,109,.12);--exc:#44A8E7;--excbg:rgba(68,168,231,.14);--warn:#FAAB3F;--warnbg:rgba(250,171,63,.12);--warnln:rgba(250,171,63,.3);--onInk:#000B18;--segon:#2E3237;--glass:rgba(21,23,26,.82);--scrim:rgba(0,0,0,.6);--sheet:#15171A;--key:#24272B;--onNeg:#FBEDEC;--negsolid:#C53637;--bar:#5FB46E;--toast:#F5F7F9;--onToast:#0B1015;--toastAcc:#0075AD;--cta:linear-gradient(100deg,#87E496 0%,#52DFBF 55%,#47D2E8 100%);--onCta:#0F130F;--fill:linear-gradient(90deg,#45814F,#87E496);--glow:linear-gradient(135deg,rgba(135,228,150,.30),rgba(255,255,255,.05) 45%,rgba(71,210,232,.16));--shadow:0 12px 32px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.045);--c-groceries:#9FCC95;--c-restaurants:#E9B082;--c-shopping:#EBA6C6;--c-transport:#91C3F6;--c-coffee:#DCB87A;--c-leisure:#72D0D0;--c-travel:#C1C37E;--c-home:#72CEDE;--c-sport:#7BD1BA;--c-health:#8ECFA4;--c-gifts:#F2A7A1;--c-beauty:#F0A6B6;--c-subs:#94A3B8;--c-bank:#A3A8B0;--c-other:#94A3B8;}
.phone{width:393px;height:852px;border-radius:54px;overflow:hidden;position:relative;background:#000;color:var(--ink);font-family:'Geist',system-ui,sans-serif;box-shadow:0 0 0 1px rgba(11,15,20,.14),0 24px 60px rgba(11,15,20,.16)}
.island{position:absolute;top:11px;left:134px;width:125px;height:36px;border-radius:20px;background:#000;z-index:9}
.home{position:absolute;bottom:8px;left:126px;width:141px;height:5px;border-radius:3px;background:var(--ink);z-index:9}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.dec{color:var(--ink3)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ovl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.gb{width:44px;height:44px;border-radius:22px;background:var(--sf2);color:var(--ink);display:flex;align-items:center;justify-content:center;border:0;padding:0;font-family:inherit;flex:none}
.chip{height:36px;padding:0 12px;border-radius:18px;background:var(--sf2);color:var(--ink2);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;border:0;white-space:nowrap;font-family:inherit;flex:none}
.chip.on{background:var(--posbg);color:var(--pos);box-shadow:inset 0 0 0 1px var(--posln)}
.key{height:48px;border-radius:12px;background:var(--key);border:0;color:var(--ink);font-family:'Geist Mono',monospace;font-size:22px;display:flex;align-items:center;justify-content:center}
.sw{width:51px;height:31px;border-radius:16px;background:var(--sf3);position:relative;flex:none;border:0;padding:0}
.sw span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.2)}

</div>

</div>
<button style="height: 54px; border-radius: 27px; border: 0; background: var(--cta); color: var(--onCta); font-family: inherit; font-size: 17px; font-weight: 600">Ajouter <span class="num">12,40 €</span></button>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 -16px; padding: 8px 8px 40px; flex: 1; align-content: start; background: var(--sf2); border-radius: 0">

<button class="key" aria-label="1">1</button>

<button class="key" aria-label="2">2</button>

<button class="key" aria-label="3">3</button>

<button class="key" aria-label="4">4</button>

<button class="key" aria-label="5">5</button>

<button class="key" aria-label="6">6</button>

<button class="key" aria-label="7">7</button>

<button class="key" aria-label="8">8</button>

<button class="key" aria-label="9">9</button>

<button class="key" aria-label="Virgule">,</button>

<button class="key" aria-label="0">0</button>

<button class="key" aria-label="Effacer">⌫</button>

</div>
</section>
<div class="home"></div>
</div>
